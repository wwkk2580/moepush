name: Deploy
on:
  push:
    tags:
      - 'v*' # 匹配所有以 v 开头的 tag，如 v1.0.0
  workflow_dispatch: # 允许手动触发工作流

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Wrangler 要求 Node.js >= 22.12.0，因此必须使用 22
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wrangler
        # 锁定到一个明确支持 Node 22 的版本，避免未来 breaking change
        run: pnpm i -g wrangler@^4.88.0

      - name: Verify Toolchain
        # 便于排查问题，打印实际使用的版本
        run: |
          node -v
          pnpm -v
          wrangler --version

      - name: Run Deploy Script
        run: pnpm dlx tsx scripts/deploy.ts
        env:
          DISABLE_REGISTER: ${{ secrets.DISABLE_REGISTER }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
